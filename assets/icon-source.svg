<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tournaments app icon — two cards pairing up under a quiet bracket motif.
       Neutral grayscale, soft rounded square, no logotype. Reads as comparison/
       judgment without anchoring on any one kind (typography, color, images). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f2"/>
      <stop offset="1" stop-color="#e6e3dc"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe8e0"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1d1a"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
  </defs>

  <!-- Soft rounded square background, macOS Big Sur shape -->
  <rect x="60" y="60" width="904" height="904" rx="208" ry="208" fill="url(#bg)"/>
  <rect x="60" y="60" width="904" height="904" rx="208" ry="208" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

  <!-- Two facing cards: light vs dark, the universal pairwise gesture -->
  <g>
    <rect x="184" y="248" width="288" height="528" rx="36" ry="36" fill="url(#cardL)" stroke="rgba(0,0,0,0.08)" stroke-width="2"/>
    <rect x="552" y="248" width="288" height="528" rx="36" ry="36" fill="url(#cardR)"/>
  </g>

  <!-- Bracket motif: a small "vs" carat between the two cards. Two strokes
       converging to a center dot — the abstract shape of pairwise judgment. -->
  <g stroke="#2b2926" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 480 470 L 512 512 L 480 554"/>
    <path d="M 544 470 L 512 512 L 544 554"/>
  </g>
  <circle cx="512" cy="512" r="10" fill="#2b2926"/>

  <!-- Thin sub-bar under each card (results/ranking hint) -->
  <g fill="rgba(0,0,0,0.18)">
    <rect x="216" y="708" width="224" height="14" rx="6"/>
    <rect x="216" y="736" width="160" height="10" rx="5"/>
  </g>
  <g fill="rgba(255,255,255,0.32)">
    <rect x="584" y="708" width="224" height="14" rx="6"/>
    <rect x="584" y="736" width="160" height="10" rx="5"/>
  </g>
</svg>
